route:
  receiver: ntfy-warning
  group_by: [alertname, instance]
  group_wait: 2m
  group_interval: 10m
  repeat_interval: 12h
  routes:
    # Thermal shutdown: eerst webhook (actie), dan ook ntfy
    - match:
        action: shutdown
      receiver: thermal-shutdown-webhook
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 2h
      continue: true

    # Critical → ntfy
    - match:
        severity: critical
      receiver: ntfy-critical
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h

receivers:
  - name: ntfy-warning
    webhook_configs:
      - url: 'http://alertmanager-ntfy:9095/hook'
        send_resolved: true

  - name: ntfy-critical
    webhook_configs:
      - url: 'http://alertmanager-ntfy:9095/hook'
        send_resolved: true

  - name: thermal-shutdown-webhook
    webhook_configs:
      - url: 'http://thermal-shutdown:9095/webhook'
        send_resolved: false

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['instance']
