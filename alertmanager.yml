route:
  receiver: ntfy-warning
  group_by: [alertname, instance]
  group_wait: 2m
  group_interval: 10m
  repeat_interval: 12h
  routes:
    # Thermal shutdown: eerst webhook (actie), dan ook ntfy
    - match:
        action: shutdown
      receiver: thermal-shutdown-webhook
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 2h
      continue: true

    # Thermal cooldown: webhook (throttle-actie) + ntfy in dezelfde receiver —
    # geen aparte severity:warning route nodig, dit matcht vóór het anders naar
    # ntfy-warning was gevallen via de root default
    - match:
        action: cooldown
      receiver: thermal-cooldown-webhook
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 30m

    # Critical → ntfy
    - match:
        severity: critical
      receiver: ntfy-critical
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

receivers:
  - name: ntfy-warning
    webhook_configs:
      - url: 'http://alertmanager-ntfy:9095/hook'
        send_resolved: true

  - name: ntfy-critical
    webhook_configs:
      - url: 'http://alertmanager-ntfy:9095/hook'
        send_resolved: true

  - name: thermal-shutdown-webhook
    webhook_configs:
      - url: 'http://thermal-shutdown:9095/webhook'
        send_resolved: false

  - name: thermal-cooldown-webhook
    webhook_configs:
      - url: 'http://thermal-shutdown:9095/cooldown'
        send_resolved: true   # nodig voor cooldown-reset bij herstel
      - url: 'http://alertmanager-ntfy:9095/hook'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['instance']

  # Host down -> meld de VM's op die host niet apart (20/10/2026: 51x InstanceDown begroef de Z2M-melding).
  # Enkel VM's waarvan de host zeker is; onzekere VM's blijven bewust zelf melden.
  - source_matchers: ['alertname="InstanceDown"', 'instance="NETWORKSERVER"']
    target_matchers: ['alertname="InstanceDown"', 'instance=~"VM-ADGUARD|VM-NPM|VM-NETBOX|VM-AUTH"']
  - source_matchers: ['alertname="InstanceDown"', 'instance="MEDIASERVER"']
    target_matchers: ['alertname="InstanceDown"', 'instance=~"VM-PLEX|VM-IMMICH|VM-MUSIC|VM-DOCS"']
  - source_matchers: ['alertname="InstanceDown"', 'instance="WINDOWSSERVER2025"']
    target_matchers: ['alertname="InstanceDown"', 'instance=~"VM-AI-ENGINE|VM-APPS|VM-AUTOBA|VM-OPENCLAW|VM-WORKINGLOCAL"']
  - source_matchers: ['alertname="InstanceDown"', 'instance="PVE-MS01-I9"']
    target_matchers: ['alertname="InstanceDown"', 'instance=~"VM-AI-NODE-I9|VM-MEETRIQ-DATA|VM-MEETRIQ-METRICS|VM-MEETRIQ-BUSINESS"']
  - source_matchers: ['alertname="InstanceDown"', 'instance="PVE-MS01-I5"']
    target_matchers: ['alertname="InstanceDown"', 'instance=~"VM-AI-NODE-I5"']
