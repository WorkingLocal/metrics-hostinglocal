services:

  # Prometheus in host mode to reach Tailscale nodes
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-metrics
    network_mode: host
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.listen-address=0.0.0.0:9090'
      - '--web.enable-lifecycle'

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager-metrics
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - proxy

  alertmanager-ntfy:
    build: ./alertmanager-ntfy
    container_name: alertmanager-ntfy
    restart: unless-stopped
    environment:
      NTFY_URL: http://ntfy:80
      NTFY_TOPIC: homelab
      NTFY_TOKEN: ${NTFY_PUBLISHER_TOKEN}
    networks:
      - proxy

  grafana:
    image: grafana/grafana:11.6.2
    container_name: grafana-metrics
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://metrics.hostinglocal.be
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.hostinger.com:587
      GF_SMTP_USER: info@workinglocal.be
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: info@workinglocal.be
      GF_SMTP_FROM_NAME: "Hosting Local Metrics"
    networks:
      - proxy

  # Ontvangt Alertmanager webhooks en voert graceful SSH shutdown uit bij hoge temperatuur
  thermal-shutdown:
    build: ./thermal-shutdown
    container_name: thermal-shutdown-metrics
    restart: unless-stopped
    volumes:
      - ./thermal-shutdown/hosts.yml:/app/hosts.yml:ro
      - /root/.ssh/thermal_shutdown:/app/keys/id_ed25519:ro
    environment:
      SSH_KEY_PATH: /app/keys/id_ed25519

volumes:
  prometheus_data:
    name: metrics_prometheus_data
  grafana_data:
    name: metrics_grafana_data

networks:
  proxy:
    external: true
