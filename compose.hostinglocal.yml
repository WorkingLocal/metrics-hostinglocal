services:

  # Prometheus in host mode to reach Tailscale nodes
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-metrics
    network_mode: host
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.hostinglocal.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=500d'
      - '--web.listen-address=0.0.0.0:9090'
      - '--web.enable-lifecycle'

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager-metrics
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - proxy
      - metrics_internal

  alertmanager-ntfy:
    build: ./alertmanager-ntfy
    container_name: alertmanager-ntfy
    restart: unless-stopped
    environment:
      NTFY_URL: ${NTFY_URL:-http://100.125.153.71:2586}
      NTFY_TOPIC: homelab
      NTFY_TOKEN: ${NTFY_PUBLISHER_TOKEN}
    networks:
      - proxy
      - metrics_internal

  grafana:
    image: grafana/grafana:11.6.2
    container_name: grafana-metrics
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.hostinglocal.be:104.21.54.79"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://metrics.hostinglocal.be
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.hostinger.com:587
      GF_SMTP_USER: info@workinglocal.be
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: info@workinglocal.be
      GF_SMTP_FROM_NAME: "Hosting Local Metrics"
      # Keycloak SSO
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GRAFANA_OIDC_SECRET}"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile groups"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.hostinglocal.be/realms/hostinglocal/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.hostinglocal.be/realms/hostinglocal/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.hostinglocal.be/realms/hostinglocal/protocol/openid-connect/userinfo"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], '/Admins') && 'Admin' || 'Viewer'"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "https://auth.hostinglocal.be/realms/hostinglocal/protocol/openid-connect/logout?post_logout_redirect_uri=https://metrics.hostinglocal.be&client_id=grafana"
    ports:
      - "3000:3000"
    networks:
      - proxy

  # SMART disk health monitoring (lokale schijven van de metrics server)
  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:latest
    container_name: smartctl-exporter
    privileged: true
    network_mode: host
    restart: unless-stopped

  # Ontvangt Alertmanager webhooks en voert graceful SSH shutdown uit bij hoge temperatuur
  thermal-shutdown:
    build: ./thermal-shutdown
    container_name: thermal-shutdown-metrics
    restart: unless-stopped
    volumes:
      - ./thermal-shutdown/hosts.yml:/app/hosts.yml:ro
      - /root/.ssh/thermal_shutdown:/app/keys/id_ed25519:ro
    environment:
      SSH_KEY_PATH: /app/keys/id_ed25519
    networks:
      - metrics_internal

volumes:
  prometheus_data:
    name: metrics_prometheus_data
  grafana_data:
    name: metrics_grafana_data

networks:
  proxy:
    external: true
  metrics_internal:
    name: metrics_internal
