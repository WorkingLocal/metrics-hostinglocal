services:

  # Prometheus in host mode to reach Tailscale nodes
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-metrics
    network_mode: host
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.hostinglocal.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=0'
      - '--storage.tsdb.retention.size=150GB'
      - '--web.listen-address=0.0.0.0:9090'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager-metrics
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - proxy
      - metrics_internal

  alertmanager-ntfy:
    build: ./alertmanager-ntfy
    container_name: alertmanager-ntfy
    restart: unless-stopped
    environment:
      NTFY_URL: ${NTFY_URL:-https://ntfy.hostinglocal.be}
      NTFY_TOKEN: ${NTFY_PUBLISHER_TOKEN}
      NTFY_TOPIC_CRITICAL: hl-critical
      NTFY_TOPIC_WARNING: hl-warning
      NTFY_TOPIC_RESOLVED: hl-resolved
      NTFY_TOPIC_BACKUP: hl-backup
    ports:
      - "9095:9095"
    networks:
      - proxy
      - metrics_internal

  # UniFi Poller — scrapet UniFi API voor rijke AP/switch/client metrics
  # Vereist: lokale UniFi admin account (geen SSO) op UDM Pro Max
  # Aanmaken: UniFi UI → Settings → Admins → Add Admin → "Local Access Only"
  # Prometheus scrapet via localhost:9130 (host-mode Prometheus kan published port bereiken)
  unifi-poller:
    image: ghcr.io/unpoller/unpoller:latest
    container_name: unifi-poller
    restart: unless-stopped
    environment:
      UP_UNIFI_DEFAULT_URL: https://192.168.111.1
      UP_UNIFI_DEFAULT_USER: ${UNIFI_POLLER_USER}
      UP_UNIFI_DEFAULT_PASS: ${UNIFI_POLLER_PASS}
      UP_UNIFI_DEFAULT_VERIFY_SSL: "false"
      UP_PROMETHEUS_HTTP_LISTEN: "0.0.0.0:9130"
      UP_PROMETHEUS_NAMESPACE: unifi
      UP_INFLUXDB_DISABLE: "true"
      UP_UNIFI_DEFAULT_SAVE_SITES: "true"
      UP_UNIFI_DEFAULT_SAVE_DPI: "false"
    ports:
      - "9130:9130"

  grafana:
    build: ./grafana
    image: grafana-hl:11.6.2
    container_name: grafana-metrics
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.hostinglocal.be:104.21.54.79"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/custom.css:/usr/share/grafana/public/custom.css:ro
      - ./grafana/assets/hl-logo.png:/usr/share/grafana/public/img/hl-logo.png:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://metrics.hostinglocal.be
      GF_SMTP_ENABLED: "false"
      # Keycloak SSO
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GRAFANA_OIDC_SECRET}"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile groups"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.hostinglocal.be/realms/hostinglocal/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.hostinglocal.be/realms/hostinglocal/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.hostinglocal.be/realms/hostinglocal/protocol/openid-connect/userinfo"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], '/Admins') && 'Admin' || 'Viewer'"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "https://auth.hostinglocal.be/realms/hostinglocal/protocol/openid-connect/logout?post_logout_redirect_uri=http://metrics.hostinglocal.be&client_id=grafana"
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      # Kiosk / HDMI display — anonymous viewer toegang (read-only, geen edit)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      # iframe embedding voor kiosk rotatie HTML pagina
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "3000:3000"
    networks:
      - proxy

  # SNMP Exporter — scrapet UDM Pro Max interface metrics (if_mib module)
  # Prometheus: job=unifi-snmp, target=192.168.111.1, via localhost:9116
  # Vereiste: SNMP v2c inschakelen op UDM Pro Max: Settings → System → SNMP
  snmp-exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp-exporter
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    command:
      - '--config.file=/etc/snmp_exporter/snmp.yml'
      - '--web.listen-address=0.0.0.0:9116'

  # SMART disk health monitoring (lokale schijven van de metrics server)
  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:latest
    container_name: smartctl-exporter
    privileged: true
    network_mode: host
    restart: unless-stopped

  # Ontvangt Alertmanager webhooks en voert graceful SSH shutdown uit bij hoge temperatuur
  thermal-shutdown:
    build: ./thermal-shutdown
    container_name: thermal-shutdown-metrics
    restart: unless-stopped
    volumes:
      - ./thermal-shutdown/hosts.yml:/app/hosts.yml:ro
      - /root/.ssh/thermal_shutdown:/app/keys/id_ed25519:ro
    environment:
      SSH_KEY_PATH: /app/keys/id_ed25519
    networks:
      - metrics_internal

  loki:
    image: grafana/loki:3.3.2
    container_name: loki-metrics
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - proxy

  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail-metrics
    restart: unless-stopped
    user: root
    volumes:
      - ./loki/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - promtail_positions:/tmp/promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - proxy

volumes:
  prometheus_data:
    name: metrics_prometheus_data
  grafana_data:
    name: metrics_grafana_data
  loki_data:
    name: metrics_loki_data
  promtail_positions:
    name: metrics_promtail_positions

networks:
  proxy:
    external: true
  metrics_internal:
    name: metrics_internal
