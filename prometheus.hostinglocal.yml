global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: hostinglocal

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:

  # Prometheus zelf
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # METRICSSERVER (Dell OptiPlex 3050, lokale host, node_exporter systemd)
  - job_name: 'metricsserver'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          instance: 'METRICSSERVER'

  # SMART disk health — METRICSSERVER (smartctl_exporter poort 9633)
  - job_name: 'smartctl-metricsserver'
    static_configs:
      - targets: ['localhost:9633']
        labels:
          instance: 'METRICSSERVER'

  # SMART disk health — PVE-MS01-I9 (Proxmox host, Tailscale 100.81.170.58)
  - job_name: 'smartctl-pve-ms01-i9'
    static_configs:
      - targets: ['100.81.170.58:9633']
        labels:
          instance: 'PVE-MS01-I9'

  # SMART disk health — PVE-MS01-I5 (Proxmox host, Tailscale 100.94.188.94)
  - job_name: 'smartctl-pve-ms01-i5'
    static_configs:
      - targets: ['100.94.188.94:9633']
        labels:
          instance: 'PVE-MS01-I5'

  # SMART disk health — MEDIASERVER (Proxmox NUC, 192.168.111.20 — geen Tailscale scrape)
  # Vereist: smartctl_exporter als systemd service op poort 9633
  - job_name: 'smartctl-mediaserver'
    static_configs:
      - targets: ['192.168.111.20:9633']
        labels:
          instance: 'MEDIASERVER'

  # SMART disk health — NETWORKSERVER (Proxmox i3-N305, Tailscale 100.119.137.54)
  # Vereist: smartctl_exporter als systemd service op poort 9633
  - job_name: 'smartctl-networkserver'
    static_configs:
      - targets: ['100.119.137.54:9633']
        labels:
          instance: 'NETWORKSERVER'

  # VPS-HOSTINGLOCAL (externe monitoring VPS, node_exporter systemd)
  - job_name: 'vps-hostinglocal'
    static_configs:
      - targets: ['100.125.153.71:9100']
        labels:
          instance: 'VPS-HOSTINGLOCAL'

  # VPS-WORKINGLOCAL (RackNerd 8GB, Tailscale 100.107.226.24)
  - job_name: 'vps-workinglocal'
    static_configs:
      - targets: ['100.107.226.24:9100']
        labels:
          instance: 'VPS-WORKINGLOCAL'

  # Windows Server 2025 (Hyper-V host)
  # Vereist: windows_exporter op 100.92.201.100:9182
  - job_name: 'windows-server'
    static_configs:
      - targets: ['100.92.201.100:9182']
        labels:
          instance: 'WINDOWSSERVER2025'

  # VM-AutoBA
  # Vereist: node_exporter op 100.107.82.21:9100
  - job_name: 'vm-autoba'
    static_configs:
      - targets: ['100.107.82.21:9100']
        labels:
          instance: 'VM-AUTOBA'

  # n8n workflow metrics (VM-AUTOBA, poort 5678)
  # Tijdelijk op VM-AUTOBA — migreert naar HA cluster
  - job_name: 'n8n'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['192.168.111.207:5678']
        labels:
          instance: 'N8N'

  # VM-AI-Engine
  # Vereist: node_exporter op 100.80.180.55:9100
  - job_name: 'vm-ai-engine'
    static_configs:
      - targets: ['100.80.180.55:9100']
        labels:
          instance: 'VM-AI-ENGINE'

  # NUT-SERVER (Raspberry Pi 3B)
  # Vereist: node_exporter op 100.97.195.23:9100
  - job_name: 'nut-server'
    static_configs:
      - targets: ['100.97.195.23:9100']
        labels:
          instance: 'NUT-SERVER'

  # PVE-MS01-I9 (Proxmox host, ex ai-node-i9, Tailscale 100.81.170.58)
  - job_name: 'pve-ms01-i9'
    static_configs:
      - targets: ['100.81.170.58:9100']
        labels:
          instance: 'PVE-MS01-I9'

  # VM-AI-NODE-I9 (Ubuntu 24.04 VM op PVE-MS01-I9, Tailscale 100.64.1.25)
  - job_name: 'vm-ai-node-i9'
    static_configs:
      - targets: ['100.64.1.25:9100']
        labels:
          instance: 'VM-AI-NODE-I9'

  # PVE-MS01-I5 (Proxmox host, ex ai-node-i5, Tailscale 100.94.188.94)
  - job_name: 'pve-ms01-i5'
    static_configs:
      - targets: ['100.94.188.94:9100']
        labels:
          instance: 'PVE-MS01-I5'

  # VM-AI-NODE-I5 (Ubuntu 24.04 VM op PVE-MS01-I5, Tailscale 100.101.48.4)
  - job_name: 'vm-ai-node-i5'
    static_configs:
      - targets: ['100.101.48.4:9100']
        labels:
          instance: 'VM-AI-NODE-I5'

  # VM-IMMICH (Ubuntu 24.04, 192.168.111.51 — geen Tailscale)
  - job_name: 'vm-immich'
    static_configs:
      - targets: ['192.168.111.51:9100']
        labels:
          instance: 'VM-IMMICH'

  # MEDIASERVER (Proxmox host NUC i5-8259U, 192.168.111.20)
  - job_name: 'mediaserver'
    static_configs:
      - targets: ['192.168.111.20:9100']
        labels:
          instance: 'MEDIASERVER'

  # VM-PLEX (Ubuntu 24.04, 192.168.111.50 — geen Tailscale)
  - job_name: 'vm-plex'
    static_configs:
      - targets: ['192.168.111.50:9100']
        labels:
          instance: 'VM-PLEX'

  # VM-APPS (Hyper-V VM, Coolify+Vaultwarden, Tailscale 100.97.124.46)
  - job_name: 'vm-apps'
    static_configs:
      - targets: ['100.97.124.46:9100']
        labels:
          instance: 'VM-APPS'

  # NETWORKSERVER (Proxmox host i3-N305, Tailscale 100.119.137.54)
  - job_name: 'networkserver'
    static_configs:
      - targets: ['100.119.137.54:9100']
        labels:
          instance: 'NETWORKSERVER'

  # VM-NPM (Nginx Proxy Manager, Tailscale 100.75.230.22)
  - job_name: 'vm-npm'
    static_configs:
      - targets: ['100.75.230.22:9100']
        labels:
          instance: 'VM-NPM'

  # VM-NETBOX (NetBox IPAM, Tailscale 100.122.166.117)
  - job_name: 'vm-netbox'
    static_configs:
      - targets: ['100.122.166.117:9100']
        labels:
          instance: 'VM-NETBOX'

  # VM-ADGUARD node_exporter (192.168.111.61 — geen Tailscale)
  - job_name: 'vm-adguard'
    static_configs:
      - targets: ['192.168.111.61:9100']
        labels:
          instance: 'VM-ADGUARD'

  # VM-ADGUARD AdGuard Home exporter (poort 9617)
  - job_name: 'adguard-home'
    static_configs:
      - targets: ['192.168.111.61:9617']
        labels:
          instance: 'VM-ADGUARD'

  # VM-OPENCLAW (OpenClaw AI gateway, Tailscale 100.92.71.9)
  - job_name: 'vm-openclaw'
    static_configs:
      - targets: ['100.92.71.9:9100']
        labels:
          instance: 'VM-OPENCLAW'

  # UNIFI Poller — rijke AP/switch/client metrics via UniFi API
  # Container draait op METRICSSERVER, publiceert poort 9130
  # Vereist: lokale UniFi admin account (UNIFI_POLLER_USER/PASS in .env)
  - job_name: 'unifi-poller'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9130']
        labels:
          instance: 'UNIFI-GATEWAY'

  # UNIFI Gateway (via SNMP Exporter op METRICSSERVER — host network, localhost:9116)
  # SNMPv3 inschakelen op UDM Pro Max: Settings → System → Integrations → SNMP → v3,
  # lokale user aanmaken (auth + priv wachtwoord zijn hetzelfde veld in de Unifi UI)
  # auth-profiel 'unifi_v3' staat in snmp.yml (credentials via deploy_sftp.py getemplate, niet in git)
  - job_name: 'unifi-snmp'
    scrape_interval: 60s
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [unifi_v3]
    static_configs:
      - targets: ['192.168.111.1']
        labels:
          instance: 'UNIFI-GATEWAY'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: 'localhost:9116'

  # TRAVELSERVER (TrueNAS SCALE, Minisforum S100, Tailscale 100.113.215.17 -- herinstalleerd 2026-06-30)
  - job_name: 'travelserver'
    static_configs:
      - targets: ['100.113.215.17:9100']
        labels:
          instance: 'TRAVELSERVER'

  # FILESERVER (Synology DS423+, node_exporter via Docker, Tailscale 100.72.50.41)
  - job_name: 'fileserver'
    static_configs:
      - targets: ['100.72.50.41:9100']
        labels:
          instance: 'FILESERVER'

  # VM-MUSIC (Ubuntu 24.04, Navidrome+Lidarr+MA, 192.168.111.53 — geen Tailscale)
  - job_name: 'vm-music'
    static_configs:
      - targets: ['192.168.111.53:9100']
        labels:
          instance: 'VM-MUSIC'

  # VM-DOCS (Ubuntu 24.04, Calibre+Paperless+BookStack, 192.168.111.54 — geen Tailscale)
  - job_name: 'vm-docs'
    static_configs:
      - targets: ['192.168.111.54:9100']
        labels:
          instance: 'VM-DOCS'

  # VM-AUTH (Keycloak 26.2 SSO, NETWORKSERVER VM 1604, Tailscale 100.82.145.54)
  - job_name: 'vm-auth'
    static_configs:
      - targets: ['100.82.145.54:9100']
        labels:
          instance: 'VM-AUTH'

  # FANSERVER (Raspberry Pi 4 8GB, PWM fan controller, Tailscale 100.103.226.56)
  - job_name: 'fanserver'
    static_configs:
      - targets: ['100.103.226.56:9100']
        labels:
          instance: 'FANSERVER'

  # VM-NETBOX applicatie metrics (django-prometheus, METRICS_ENABLED=true vereist)
  # Exposeert netbox_object_count per model + request/latency metrics
  - job_name: 'netbox-app'
    scrape_interval: 60s
    metrics_path: /metrics
    static_configs:
      - targets: ['100.122.166.117:8000']
        labels:
          instance: 'VM-NETBOX'

  # PROXMOXMANAGER (NUC Celeron, huidig IP 192.168.111.15, node_exporter systemd)
  # Vereist: node_exporter geïnstalleerd als systemd service op poort 9100
  - job_name: 'proxmoxmanager'
    static_configs:
      - targets: ['192.168.111.15:9100']
        labels:
          instance: 'PROXMOXMANAGER'

  # ====== CONTROLLERS (Xibo signage + kiosk displays) ======

  # KIOSK-TOUCH (Mele Quieter 3, Windows 10 IoT Enterprise LTSC, Working Local Focus Kiosk)
  # IP nu .34 — na Unifi DHCP migratie wijzigen naar 192.168.111.120
  - job_name: 'kiosk-touch'
    static_configs:
      - targets: ['192.168.111.34:9182']
        labels:
          instance: 'KIOSK-TOUCH'
          group: 'controllers'

  # XIBO-SURFACE-WOONKAMER (Microsoft Surface Pro 4, Ubuntu 22.04, Working Local)
  - job_name: 'xibo-surface'
    static_configs:
      - targets: ['100.77.163.65:9100']
        labels:
          instance: 'XIBO-SURFACE'
          group: 'controllers'

  # ====== SMARTHOMESERVER ======

  # VM-WORKINGLOCAL (Hyper-V Gen2 Ubuntu 24.04 op WINDOWSSERVER2025, Tailscale 100.69.76.52)
  - job_name: 'vm-workinglocal'
    static_configs:
      - targets: ['100.69.76.52:9100']
        labels:
          instance: 'VM-WORKINGLOCAL'

  # SMARTHOMESERVER (HAOS Intel NUC i3) — native HA Prometheus integration (alle numerieke entiteiten)
  # Endpoint: /api/prometheus met Bearer token (long-lived access token)
  # METRICSSERVER bereikt HAOS via lokaal netwerk 192.168.111.75
  - job_name: 'smarthomeserver'
    scrape_interval: 120s
    metrics_path: /api/prometheus
    bearer_token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiIwODlmNDViMzlmZDQ0N2I5OWExNTE0ZTRhMmRhN2Q0NiIsImlhdCI6MTc3OTUxNjAxMywiZXhwIjoyMDk0ODc2MDEzfQ.-JZIKRGCnxQieFTxOXFfEZwT2VPgbEUb4NzOmpqqa1E'
    static_configs:
      - targets: ['192.168.111.75:8123']
        labels:
          instance: 'SMARTHOMESERVER'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'homeassistant_state_change_created|homeassistant_last_updated_time_seconds|homeassistant_entity_info'
        action: drop
