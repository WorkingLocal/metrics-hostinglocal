groups:
  - name: node_alerts
    rules:

      # ── Temperatuuralerts ──────────────────────────────────────────────────
      # chip=platform_coretemp_0 = Intel CPU package temp (Linux nodes)
      # chip=thermal_thermal_zone0 = Raspberry Pi CPU temp (NUT-SERVER)
      # sensor=temp1 = Package-temp bij coretemp; sensor=temp0 = enige sensor bij Pi

      - alert: HighTemperatureWarning
        expr: >
          node_hwmon_temp_celsius{
            chip=~"platform_coretemp_0|thermal_thermal_zone0",
            sensor=~"temp0|temp1"
          } > 80
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Hoge temperatuur op {{ $labels.instance }}"
          description: "Temperatuur is {{ $value | humanize }}°C op {{ $labels.instance }} (drempel: 80°C)"

      - alert: HighTemperatureCritical
        expr: >
          node_hwmon_temp_celsius{
            chip=~"platform_coretemp_0|thermal_thermal_zone0",
            sensor=~"temp0|temp1"
          } > 90
        for: 30s
        labels:
          severity: critical
          action: shutdown
        annotations:
          summary: "KRITIEKE temperatuur op {{ $labels.instance }} — SHUTDOWN GESTART"
          description: "Temperatuur is {{ $value | humanize }}°C op {{ $labels.instance }} (drempel: 90°C) — graceful shutdown wordt uitgevoerd"

      # SMARTHOMESERVER (HAOS) temperatuur via Home Assistant System Monitor
      # node_hwmon niet beschikbaar in HA-container; temp komt via HA entity in Prometheus
      - alert: SmarthomeserverTemperatureWarning
        expr: homeassistant_sensor_temperature_celsius{entity="sensor.system_monitor_processortemperatuur"} > 75
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Hoge temperatuur op SMARTHOMESERVER (HAOS)"
          description: "NUC CPU temperatuur is {{ $value | humanize }}°C (drempel: 75°C)"

      - alert: SmarthomeserverTemperatureCritical
        expr: homeassistant_sensor_temperature_celsius{entity="sensor.system_monitor_processortemperatuur"} > 85
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "KRITIEKE temperatuur op SMARTHOMESERVER (HAOS)"
          description: "NUC CPU temperatuur is {{ $value | humanize }}°C (drempel: 85°C)"

      # WINDOWSSERVER2025 temperatuur via LibreHardwareMonitor textfile exporter
      # Xeon Silver 4114 dual-socket — max over beide sockets
      - alert: WindowsServerTemperatureWarning
        expr: max(windows_hardware_temperature_celsius{instance="WINDOWSSERVER2025", sensor="CPU_Package"}) > 75
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Hoge temperatuur op WINDOWSSERVER2025"
          description: "Xeon CPU Package temperatuur is {{ $value | humanize }}°C (drempel: 75°C)"

      - alert: WindowsServerTemperatureCritical
        expr: max(windows_hardware_temperature_celsius{instance="WINDOWSSERVER2025", sensor="CPU_Package"}) > 85
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "KRITIEKE temperatuur op WINDOWSSERVER2025"
          description: "Xeon CPU Package temperatuur is {{ $value | humanize }}°C (drempel: 85°C)"

      # ── Overige alerts ────────────────────────────────────────────────────

      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} niet bereikbaar"
          description: "{{ $labels.instance }} is al meer dan 2 minuten niet bereikbaar."

      - alert: HighCpuUsageWarning
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hoog CPU gebruik op {{ $labels.instance }}"
          description: "CPU gebruik is {{ $value | humanize }}% op {{ $labels.instance }} (drempel: 50%)"

      - alert: HighCpuUsageCritical
        expr: >
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle",instance!~"VM-AI-NODE-I9|VM-AI-NODE-I5"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "KRITIEK CPU gebruik op {{ $labels.instance }}"
          description: "CPU gebruik is {{ $value | humanize }}% op {{ $labels.instance }} (drempel: 80%)"

      - alert: HighMemoryUsageWarning
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hoog geheugengebruik op {{ $labels.instance }}"
          description: "RAM gebruik is {{ $value | humanize }}% op {{ $labels.instance }} (drempel: 80%)"

      - alert: HighMemoryUsageCritical
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "KRITIEK geheugengebruik op {{ $labels.instance }}"
          description: "RAM gebruik is {{ $value | humanize }}% op {{ $labels.instance }} (drempel: 95%)"

      - alert: NvmeDiskUsageHigh
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay", device=~"/dev/nvme.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay", device=~"/dev/nvme.*"}) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NVMe schijf bijna vol op {{ $labels.instance }}"
          description: "{{ $labels.device }} ({{ $labels.mountpoint }}) is {{ $value | humanize }}% vol (drempel: 80%)"

      # ── SMART / schijfgezondheid ──────────────────────────────────────────

      - alert: SmartHealthFailed
        expr: smartctl_device_smart_status{} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SMART health FAILED op {{ $labels.instance }} — {{ $labels.device }}"
          description: "Schijf {{ $labels.device }} op {{ $labels.instance }} rapporteert SMART overall health FAILED."

      - alert: NvmeCriticalWarning
        expr: smartctl_device_nvme_smart_critical_warning_total{} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NVMe critical warning op {{ $labels.instance }} — {{ $labels.device }}"
          description: "NVMe schijf {{ $labels.device }} heeft een critical warning (waarde: {{ $value }})."

      - alert: SmartReallocatedSectors
        expr: smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Reallocated sectors op {{ $labels.instance }} — {{ $labels.device }}"
          description: "{{ $value }} reallocated sectors op {{ $labels.device }}. Schijf vertoont tekenen van slijtage."

      - alert: NvmeDiskUsageCritical
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay", device=~"/dev/nvme.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay", device=~"/dev/nvme.*"}) * 100 > 90
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NVMe schijf kritiek vol op {{ $labels.instance }}"
          description: "{{ $labels.device }} ({{ $labels.mountpoint }}) is {{ $value | humanize }}% vol!"

  - name: unifi_alerts
    rules:

      # WAN1 down via SNMP (eth8 = Realtek 2.5GbE, de WAN RJ45 poort op UDM Pro Max)
      # ifOperStatus: 1=up, 2=down, 3=testing, 5=dormant, 7=lowerLayerDown
      - alert: UnifiWan1Down
        expr: ifOperStatus{instance="UNIFI-GATEWAY", ifName="eth8"} != 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "UniFi WAN1 DOWN op UDM Pro Max"
          description: "Interface eth8 (Realtek 2.5GbE WAN) is niet operationeel (status: {{ $value }})"

      # AP offline via unifi-poller
      # state label: 1=connected, 0=disconnected — verschijnt zodra unifi-poller draait
      - alert: UnifiApOffline
        expr: unifi_uap_info{state="0"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "UniFi AP offline: {{ $labels.name }}"
          description: "Access Point {{ $labels.name }} ({{ $labels.ip }}) is niet verbonden"

      # Switch offline via unifi-poller
      - alert: UnifiSwitchOffline
        expr: unifi_usw_info{state="0"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "UniFi Switch offline: {{ $labels.name }}"
          description: "Switch {{ $labels.name }} ({{ $labels.ip }}) is niet verbonden"

  - name: network_bandwidth_alerts
    rules:

      # Test mislukt — iperf3 kon server niet bereiken of meting was 0
      # for: 90m = ~2 opeenvolgende timer runs (timer loopt elk uur)
      - alert: NetworkBenchmarkFailed
        expr: network_iperf3_success == 0
        for: 90m
        labels:
          severity: warning
        annotations:
          summary: "iPerf3 test mislukt: {{ $labels.hostname }} → {{ $labels.target }}"
          description: "Bandbreedte test mislukt van {{ $labels.hostname }} naar {{ $labels.target }} via {{ $labels.interface }} ({{ $labels.interface_type }}). Controleer of iperf3 server actief is op {{ $labels.target }}."

      # 2.5GbE verbinding onder 2 Gbps — verwacht ~2.35 Gbps op basis van gemeten benchmarks
      - alert: NetworkBandwidthLow25GbE
        expr: >
          network_iperf3_bits_per_second{interface_type="lan_2_5gbe"} > 0
          and
          network_iperf3_bits_per_second{interface_type="lan_2_5gbe"} < 2000000000
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Lage bandbreedte (2.5GbE): {{ $labels.hostname }} → {{ $labels.target }}"
          description: "{{ $labels.hostname }} meet {{ $value | humanize }}bps naar {{ $labels.target }} via {{ $labels.interface }} — verwacht >2 Gbps voor 2.5GbE link (referentie: 2.35 Gbps)."

      # 1GbE verbinding onder 750 Mbps — verwacht ~950 Mbps
      - alert: NetworkBandwidthLow1GbE
        expr: >
          network_iperf3_bits_per_second{interface_type="lan_1gbe"} > 0
          and
          network_iperf3_bits_per_second{interface_type="lan_1gbe"} < 750000000
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Lage bandbreedte (1GbE): {{ $labels.hostname }} → {{ $labels.target }}"
          description: "{{ $labels.hostname }} meet {{ $value | humanize }}bps naar {{ $labels.target }} via {{ $labels.interface }} — verwacht >750 Mbps voor 1GbE link."

  # ── Windows Kiosk alerts (windows_exporter metrics) ─────────────────────
  - name: windows_kiosk_alerts
    rules:

      # Temperatuur via thermalzone collector (Kelvin → Celsius door windows_exporter)
      - alert: KioskTemperatureWarning
        expr: windows_thermalzone_temperature_celsius{instance="KIOSK-TOUCH"} > 80
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Hoge temperatuur op KIOSK-TOUCH"
          description: "Thermalzone temperatuur is {{ $value | humanize }}°C (drempel: 80°C)"

      - alert: KioskTemperatureCritical
        expr: windows_thermalzone_temperature_celsius{instance="KIOSK-TOUCH"} > 90
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "KRITIEKE temperatuur op KIOSK-TOUCH"
          description: "Thermalzone temperatuur is {{ $value | humanize }}°C (drempel: 90°C)"

      # CPU gebruik
      - alert: KioskHighCpuWarning
        expr: (1 - avg(rate(windows_cpu_time_total{instance="KIOSK-TOUCH", mode="idle"}[5m]))) * 100 > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hoog CPU gebruik op KIOSK-TOUCH"
          description: "CPU gebruik is {{ $value | humanize }}% (drempel: 70%)"

      - alert: KioskHighCpuCritical
        expr: (1 - avg(rate(windows_cpu_time_total{instance="KIOSK-TOUCH", mode="idle"}[5m]))) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "KRITIEK CPU gebruik op KIOSK-TOUCH"
          description: "CPU gebruik is {{ $value | humanize }}% (drempel: 90%)"

      # Geheugen
      - alert: KioskHighMemoryWarning
        expr: (1 - windows_os_physical_memory_free_bytes{instance="KIOSK-TOUCH"} / windows_cs_physical_memory_bytes{instance="KIOSK-TOUCH"}) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hoog geheugengebruik op KIOSK-TOUCH"
          description: "RAM gebruik is {{ $value | humanize }}% (drempel: 80%)"

      - alert: KioskHighMemoryCritical
        expr: (1 - windows_os_physical_memory_free_bytes{instance="KIOSK-TOUCH"} / windows_cs_physical_memory_bytes{instance="KIOSK-TOUCH"}) * 100 > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "KRITIEK geheugengebruik op KIOSK-TOUCH"
          description: "RAM gebruik is {{ $value | humanize }}% (drempel: 95%)"

      # Schijfruimte C:
      - alert: KioskDiskUsageWarning
        expr: (1 - windows_logical_disk_free_bytes{instance="KIOSK-TOUCH", volume="C:"} / windows_logical_disk_size_bytes{instance="KIOSK-TOUCH", volume="C:"}) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Schijf bijna vol op KIOSK-TOUCH (C:)"
          description: "C: is {{ $value | humanize }}% vol (drempel: 80%)"

      - alert: KioskDiskUsageCritical
        expr: (1 - windows_logical_disk_free_bytes{instance="KIOSK-TOUCH", volume="C:"} / windows_logical_disk_size_bytes{instance="KIOSK-TOUCH", volume="C:"}) * 100 > 90
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Schijf kritiek vol op KIOSK-TOUCH (C:)"
          description: "C: is {{ $value | humanize }}% vol (drempel: 90%)"
