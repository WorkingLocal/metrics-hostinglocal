<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111827; }
  iframe { display: block; width: 100vw; height: 100vh; border: none; }
</style>
</head>
<body>
<iframe id="frame" src="" allowfullscreen></iframe>
<script>
var urls = [
  "http://metrics.hostinglocal.be/d/serverrack-kiosk?kiosk&refresh=30s&theme=dark",
  "http://metrics.hostinglocal.be/d/serverrack-disks?kiosk&refresh=30s&theme=dark",
  "http://metrics.hostinglocal.be/d/serverrack-energie?kiosk&refresh=30s&theme=dark"
];
var ROTATE_SECONDS = 5;
var idx = 0;
var frame = document.getElementById("frame");

function next() {
  frame.src = urls[idx];
  idx = (idx + 1) % urls.length;
}

next();
setInterval(next, ROTATE_SECONDS * 1000);
</script>
</body>
</html>
