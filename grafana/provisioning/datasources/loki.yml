apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki-metrics
    url: http://loki:3100
    access: proxy
    isDefault: false
    jsonData:
      timeout: 60
      maxLines: 5000
      derivedFields:
        - name: TraceID
          matcherRegex: "traceID=(\\w+)"
          url: ""
