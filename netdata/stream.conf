# Netdata streaming — VPS-WORKINGLOCAL als parent node
# Beheerd via GitHub: metrics-workinglocal/netdata/stream.conf
#
# Child nodes sturen metrics naar deze VPS parent.
# API keys worden gegenereerd met: python -c "import uuid; print(uuid.uuid4())"

[stream]
    # De VPS is geen child — niet doorsturen naar een hogere parent
    enabled = no

# Windows Server 2025 (Hyper-V host)
# Tailscale IP: 100.92.201.100
[596b40bb-e0d2-4c83-81fa-ddf89d416cb9]
    enabled = yes
    allow from = 100.92.201.100
    default memory mode = dbengine
    health enabled by default = auto

# VM-AutoBA (autoba.hostinglocal.be)
# Tailscale IP: 100.107.82.21
[24a2b782-a0be-4b27-82c9-00e7579425c6]
    enabled = yes
    allow from = 100.107.82.21
    default memory mode = dbengine
    health enabled by default = auto

# VM-AI-Engine
# Tailscale IP: 100.80.180.55
[413beb02-6549-49a4-8bf4-c3a1f1e0e418]
    enabled = yes
    allow from = 100.80.180.55
    default memory mode = dbengine
    health enabled by default = auto

# NUT-SERVER (Raspberry Pi 3B — Eaton UPS monitor)
# Tailscale IP: 100.97.195.23 | Lokaal: 192.168.111.250
[821f47f2-a26e-4b39-b54d-444441ebe3e0]
    enabled = yes
    allow from = 100.97.195.23
    default memory mode = dbengine
    health enabled by default = auto

# HAOS Intel NUC (Home Assistant OS)
# Tailscale IP: 100.109.230.93 | Lokaal: 192.168.111.75
# allow from = * omdat HAOS Tailscale userspace networking gebruikt (outbound via publiek IP)
[d5fe55e6-51e5-4587-980a-12c61f3eb2d2]
    enabled = yes
    allow from = *
    default memory mode = dbengine
    health enabled by default = auto
