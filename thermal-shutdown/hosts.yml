# Prometheus `instance` label -> power-control hostname (zoals gebruikt in
# infra-hostinglocal/power-control/hosts.yaml). thermal-shutdown doet zelf geen
# SSH meer — het is een dunne dispatcher naar de power-control API (FANSERVER
# primair op :8765, NUT-SERVER backup), die de graceful VM/LXC-evacuatie kent.

instance_map:
  PVE-MS01-I9: pve-ms01-i9
  PVE-MS01-I5: pve-ms01-i5
  NETWORKSERVER: networkserver
  MEDIASERVER: mediaserver
  TRAVELSERVER: travelserver
  FILESERVER: fileserver
  WINDOWSSERVER2025: windowsserver
  HAOS-NUC: haos
  NUT-SERVER: nut-server
