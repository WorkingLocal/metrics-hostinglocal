# SSH-mapping voor thermal shutdown per Prometheus instance label.
# ssh_user voor Proxmox hosts is 'root', voor Ubuntu nodes 'hostinglocal'.
# Voeg hier enkel fysieke hosts of Proxmox hosts toe — geen VMs.

hosts:
  AI-NODE-I9:
    tailscale_ip: "100.126.121.11"
    ssh_user: "hostinglocal"

  AI-NODE-I5:
    tailscale_ip: "100.78.175.49"
    ssh_user: "hostinglocal"

  NETWORKSERVER:
    tailscale_ip: "100.119.137.54"
    ssh_user: "root"

  MEDIASERVER:
    tailscale_ip: "100.111.62.69"
    ssh_user: "root"

  NUT-SERVER:
    tailscale_ip: "100.97.195.23"
    ssh_user: "hostinglocal"

  TRAVELSERVER:
    tailscale_ip: "100.83.16.76"
    ssh_user: "truenas_admin"
    ssh_port: 113
    # shutdown_cmd default (shutdown -h +1) werkt op TrueNAS SCALE (Debian-based)

  FILESERVER:
    tailscale_ip: "100.72.50.41"
    ssh_user: "vandrommethomas"
    ssh_port: 221
    shutdown_cmd: "sudo shutdown -h +1"
    # sudoers regel vereist: /etc/sudoers.d/thermal-shutdown op Synology

  WINDOWSSERVER2025:
    tailscale_ip: "100.92.201.100"
    ssh_user: "Administrator"
    shutdown_cmd: "shutdown /s /f /t 60"

  HAOS-NUC:
    tailscale_ip: "100.109.230.93"
    ssh_user: "root"
    ssh_port: 22222
    shutdown_cmd: "ha host shutdown"
